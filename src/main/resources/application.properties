spring.application.name=speaking
server.port=${PORT:8080}
spring.config.import=optional:file:./.env[.properties],optional:file:./BE/.env[.properties]

app.cors-allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.0-flash}
app.gemini.system-prompt=${GEMINI_SYSTEM_PROMPT:You are a senior IELTS Speaking mentor. Evaluate answers accurately, constructively, and return only valid JSON.}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
